[project]
name = "riskbt"
version = "0.1.0"
description = "VaR and Expected Shortfall backtesting system for Brazilian equity portfolios"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "statsmodels",
    "arch",
    "yfinance",
    "pyarrow",
    "streamlit",
    "altair",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["riskbt"]

[tool.setuptools.package-data]
riskbt = ["locales/*.json"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
